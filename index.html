<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Movies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#08080c;--surface:#111116;--surface2:#17171e;--surface3:#1d1d26;--border:#272732;--text:#f2f2f6;--sub:#9999aa;--muted:#5f5f70;--accent:#7c5cfc;--accentHi:#a58cff;--accentDark:#241b4c}
body{background:radial-gradient(circle at 50% -20%,rgba(124,92,252,.1),transparent 40%),var(--bg);color:var(--text);min-height:100vh;font-family:Inter,system-ui,sans-serif}
header{position:sticky;top:0;z-index:50;height:68px;display:flex;align-items:center;gap:18px;padding:0 24px;background:rgba(8,8,12,.8);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.06)}
.logo{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:700;white-space:nowrap}.logoIcon{width:32px;height:32px;display:grid;place-items:center;border-radius:9px;background:linear-gradient(135deg,var(--accent),#5b3ee5);box-shadow:0 5px 20px rgba(124,92,252,.25)}
.logo span{color:var(--accentHi)}
.searchWrap{position:relative;flex:1;max-width:520px}.searchIcon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}#search{width:100%;padding:11px 14px 11px 40px;border:1px solid var(--border);border-radius:10px;background:rgba(20,20,27,.9);color:var(--text);outline:none;font:inherit;font-size:14px}#search:focus{border-color:rgba(124,92,252,.7);box-shadow:0 0 0 3px rgba(124,92,252,.1)}
#count{font-size:12px;color:var(--muted);white-space:nowrap}
main{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:22px;max-width:1500px;margin:auto;padding:24px}
.player{position:relative;background:#000;border:1px solid var(--border);border-radius:14px;overflow:hidden;aspect-ratio:16/9;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.player iframe,.player video{width:100%;height:100%;border:0;display:none;background:#000}
.placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted);background:radial-gradient(circle at center,rgba(124,92,252,.08),transparent 45%),#08080c}.placeholderIcon{width:72px;height:72px;display:grid;place-items:center;border-radius:20px;background:rgba(124,92,252,.08);font-size:34px}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:10px;flex-wrap:wrap}.group{display:flex;gap:7px}.btn{height:36px;padding:0 12px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--sub);font:600 12px Inter;cursor:pointer}.btn:hover{background:var(--surface3);color:var(--text)}.btn.primary{background:var(--accentDark);border-color:rgba(124,92,252,.35);color:var(--accentHi)}
.now{padding:20px 2px}.label{display:none;color:var(--accentHi);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}.title{font-size:21px;font-weight:600}
.notice{display:none;margin-bottom:14px;padding:11px 14px;border-radius:9px;background:rgba(124,92,252,.07);border:1px solid rgba(124,92,252,.18);color:var(--sub);font-size:12px;line-height:1.5}.notice strong{color:var(--accentHi)}
.side{position:sticky;top:92px;height:calc(100vh - 116px);min-height:400px;display:flex;flex-direction:column}
.tabs{display:flex;gap:5px;margin-bottom:9px}.tab{flex:1;height:38px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--sub);font:600 12px Inter;cursor:pointer}.tab.active{background:var(--accentDark);border-color:rgba(124,92,252,.35);color:var(--accentHi)}
.listHeader{color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;padding:0 4px 9px}
.list{flex:1;min-height:0;overflow-y:auto;background:rgba(17,17,22,.88);border:1px solid var(--border);border-radius:13px}.list::-webkit-scrollbar{width:7px}.list::-webkit-scrollbar-thumb{background:#292934;border-radius:10px}
.item{position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.045);cursor:pointer}.item:hover{background:rgba(255,255,255,.035)}.item.active{background:linear-gradient(90deg,rgba(124,92,252,.17),rgba(124,92,252,.045));padding-left:17px}.item.active:before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:0 5px 5px 0;background:var(--accent)}
.num{min-width:25px;color:var(--muted);font-size:11px;text-align:right}.item.active .num{color:var(--accentHi)}.name{flex:1;color:var(--sub);font-size:13px;line-height:1.4}.item:hover .name,.item.active .name{color:var(--text)}.badge{font-size:9px;font-weight:700;text-transform:uppercase;color:var(--accentHi);background:rgba(124,92,252,.1);border:1px solid rgba(124,92,252,.18);padding:4px 6px;border-radius:6px}
.empty{padding:45px 20px;text-align:center;color:var(--muted);font-size:13px}
.player:fullscreen{width:100vw;height:100vh;aspect-ratio:auto;border:0;border-radius:0}
body.theater main{max-width:1800px;grid-template-columns:minmax(0,1fr) 300px}
@media(max-width:900px){main{grid-template-columns:1fr;padding:16px}.side{position:static;height:420px}}
@media(max-width:600px){header{height:auto;flex-wrap:wrap;padding:12px 14px;gap:10px}.searchWrap{order:3;flex-basis:100%}#count{display:none}main{padding:10px;gap:16px}.title{font-size:18px}}
</style>
</head>
<body>
<header>
  <div class="logo"><div class="logoIcon">🎬</div><div><span>My</span> Movies</div></div>
  <div class="searchWrap"><div class="searchIcon">⌕</div><input id="search" placeholder="Search movies and shows..." autocomplete="off" spellcheck="false"></div>
  <div id="count"></div>
</header>

<main>
  <section>
    <div class="player" id="player">
      <div class="placeholder" id="placeholder">
        <div class="placeholderIcon">🎬</div>
        <div>Select a movie or show to start watching</div>
      </div>
      <iframe id="iframe" allowfullscreen allow="autoplay; encrypted-media"></iframe>
      <video id="video" controls playsinline></video>
    </div>

    <div class="actions">
      <div class="group">
        <button class="btn primary" id="fullscreen">⛶ Fullscreen</button>
        <button class="btn" id="theater">▣ Theater</button>
      </div>
      <div class="group">
        <button class="btn" id="next">Next →</button>
        <button class="btn" id="openSource">↗ Open source</button>
      </div>
    </div>

    <div class="notice" id="notice">
      <strong>Tip:</strong> Google Drive files need to be shared as <strong>Anyone with the link → Viewer</strong>.
      Some third-party pages do not allow iframe embedding; use <strong>Open source</strong> for those.
    </div>

    <div class="now">
      <div class="label" id="label">Now playing</div>
      <div class="title" id="title">Select a movie or show to start watching</div>
    </div>
  </section>

  <aside class="side">
    <div class="tabs">
      <button class="tab active" data-type="movie">Movies</button>
      <button class="tab" data-type="show">Shows</button>
    </div>
    <div class="listHeader" id="listHeader">All movies</div>
    <div class="list" id="list"></div>
  </aside>
</main>

const allItems = [...movies, ...shows];
let activeType = "movie";
let currentIndex = -1;
let currentItem = null;

const iframe = document.getElementById("iframe");
const video = document.getElementById("video");
const placeholder = document.getElementById("placeholder");
const player = document.getElementById("player");
const titleEl = document.getElementById("title");
const labelEl = document.getElementById("label");
const notice = document.getElementById("notice");
const list = document.getElementById("list");
const search = document.getElementById("search");
const count = document.getElementById("count");
const listHeader = document.getElementById("listHeader");

function escapeHtml(s){
  const d=document.createElement("div");
  d.textContent=s;
  return d.innerHTML;
}

function driveFileId(url){
  const m=url.match(/\/file\/d\/([^/?]+)/) || url.match(/[?&]id=([^&]+)/);
  return m ? m[1] : null;
}

function driveFolderId(url){
  const m=url.match(/\/folders\/([^/?]+)/);
  return m ? m[1] : null;
}

function youtubeEmbed(url){
  let m=url.match(/youtu\.be\/([^?]+)/);
  if(m) return "https://www.youtube.com/embed/"+m[1];
  m=url.match(/[?&]v=([^&]+)/);
  if(m) return "https://www.youtube.com/embed/"+m[1];
  m=url.match(/youtube\.com\/playlist\?list=([^&]+)/);
  if(m) return "https://www.youtube.com/embed/videoseries?list="+m[1];
  return null;
}

function isDirectMedia(url){
  return /\.(mp4|webm|ogg|m3u8)(\?|$)/i.test(url);
}

function sourceUrl(item){
  const fileId=driveFileId(item.url);
  if(fileId) return "https://drive.google.com/file/d/"+fileId+"/preview";
  const yt=youtubeEmbed(item.url);
  if(yt) return yt;
  return item.url;
}

function resetPlayer(){
  iframe.style.display="none";
  video.style.display="none";
  iframe.src="about:blank";
  video.pause();
  video.removeAttribute("src");
  video.load();
}

function loadItem(item,index){
  currentItem=item;
  currentIndex=index;

  titleEl.textContent=item.title;
  labelEl.style.display="block";
  notice.style.display="block";
  placeholder.style.display="none";

  resetPlayer();

  const folderId=driveFolderId(item.url);
  const yt=youtubeEmbed(item.url);

  if(isDirectMedia(item.url)){
    video.src=item.url;
    video.style.display="block";
    video.play().catch(()=>{});
  }else if(driveFileId(item.url)){
    iframe.src=sourceUrl(item);
    iframe.style.display="block";
  }else if(folderId){
    // Drive folders are best opened directly; embedding a folder is inconsistent across browsers.
    iframe.src="https://drive.google.com/drive/folders/"+folderId;
    iframe.style.display="block";
  }else if(yt){
    iframe.src=yt;
    iframe.style.display="block";
  }else{
    iframe.src=item.url;
    iframe.style.display="block";
  }

  render();
}

function getVisibleItems(){
  const q=search.value.trim().toLowerCase();
  const source=activeType==="movie" ? movies : shows;
  return source.filter(x=>!q || x.title.toLowerCase().includes(q));
}

function render(){
  const items=getVisibleItems();
  list.innerHTML="";

  items.forEach((item,i)=>{
    const globalIndex=allItems.indexOf(item);
    const el=document.createElement("div");
    el.className="item"+(item===currentItem ? " active":"");
    el.innerHTML=
      '<span class="num">'+String(i+1).padStart(2,"0")+'</span>'+
      '<span class="name">'+escapeHtml(item.title)+'</span>'+
      (item.type==="show" ? '<span class="badge">Show</span>' : '<span class="badge">Movie</span>');
    el.onclick=()=>loadItem(item,globalIndex);
    list.appendChild(el);
  });

  if(!items.length){
    list.innerHTML='<div class="empty">Nothing found.</div>';
  }

  count.textContent=items.length+" "+(activeType==="movie"?"movies":"shows");
  listHeader.textContent=search.value.trim()
    ? "Search results"
    : (activeType==="movie" ? "All movies" : "All shows");
}

document.querySelectorAll(".tab").forEach(tab=>{
  tab.onclick=()=>{
    activeType=tab.dataset.type;
    currentIndex=-1;
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    tab.classList.add("active");
    render();
  };
});

search.addEventListener("input",render);

document.getElementById("fullscreen").onclick=async()=>{
  try{
    if(!document.fullscreenElement) await player.requestFullscreen();
    else await document.exitFullscreen();
  }catch(e){console.error(e);}
};

document.getElementById("theater").onclick=()=>{
  document.body.classList.toggle("theater");
};

document.getElementById("openSource").onclick=()=>{
  if(currentItem) window.open(currentItem.url,"_blank","noopener,noreferrer");
};

document.getElementById("next").onclick=()=>{
  const items=getVisibleItems();
  if(!items.length)return;
  const pos=currentItem ? items.indexOf(currentItem) : -1;
  loadItem(items[(pos+1+items.length)%items.length],0);
};

document.addEventListener("keydown",e=>{
  if(document.activeElement===search)return;
  if(e.key.toLowerCase()==="f"){
    e.preventDefault();
    document.getElementById("fullscreen").click();
  }
  if(e.key==="ArrowRight"){
    e.preventDefault();
    document.getElementById("next").click();
  }
});

render();
</script>
